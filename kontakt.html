<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <title>Kontakt – Bahnberge.de</title>
  <link rel="stylesheet" href="feedback.css">
  <script defer src="language.js"></script>
  <script defer src="feedback.js"></script>
</head>
<body>
  <main>
    <a class="back-link" href="index.html">← Zur Karte</a>
    <p class="eyebrow">Bahnberge.de</p>
    <h1>Kontakt</h1>
    <p class="feedback-intro">Ich hoffe, du konntest eine schöne Tour planen. Teile mir gerne mit, wie es war, oder gib mir Feedback zur Seite.</p>
    <section class="feedback-section" aria-labelledby="feedback-title">
      <h2 id="feedback-title">Dein Kommentar</h2>
      <form class="feedback-form" id="feedback-form" novalidate>
        <label for="feedback-name">Name</label>
        <input id="feedback-name" name="name" type="text" maxlength="100" autocomplete="name" required>

        <label for="feedback-email">E-Mail-Adresse</label>
        <input id="feedback-email" name="email" type="email" maxlength="254" autocomplete="email" required>

        <label for="feedback-comment">Kommentar oder Feedback</label>
        <textarea id="feedback-comment" name="message" rows="6" maxlength="2500" placeholder="Wie war deine Tour? Was können wir an der Seite verbessern?" required></textarea>

        <input class="feedback-honeypot" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="feedback-submit" type="submit">Abschicken</button>
        <p class="feedback-note">Dein Kommentar wird über den Website-Server per E-Mail weitergeleitet.</p>
        <p class="feedback-toast" id="feedback-toast" role="alert" aria-live="assertive" hidden></p>
      </form>
    </section>
  </main>
</body>
</html>
