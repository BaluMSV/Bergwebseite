name: Deploy to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SFTP password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass

      - name: Upload website files via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET_DIR: ${{ secrets.SFTP_TARGET_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if [[ -z "$SFTP_TARGET_DIR" ]]; then
            echo "SFTP_TARGET_DIR must be set to the website destination."
            exit 1
          fi

          printf -- '-mkdir "%s"\ncd "%s"\nput -r ./*\n' \
            "$SFTP_TARGET_DIR" "$SFTP_TARGET_DIR" > "$RUNNER_TEMP/sftp-batch"
          SSHPASS="$SFTP_PASSWORD" sshpass -e sftp \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=no \
            -P "$SFTP_PORT" \
            -b "$RUNNER_TEMP/sftp-batch" \
            "$SFTP_USERNAME@$SFTP_HOST"
